name: XuebaAI
options:
  bundleIdPrefix: com.xuebaai
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Sources/App/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.xuebaai.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/App/MNN-Bridging-Header.h
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  XuebaAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xuebaai.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/MNN-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/App/XuebaAI.entitlements
    entitlements:
      path: Sources/App/XuebaAI.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.photos-library: true
    dependencies:
      - framework: MNN.framework
        embed: true
        codeSign: true
        copy:
          destination: frameworks
      - framework: Metal.framework
        embed: false
      - framework: AVFoundation.framework
        embed: false
      - framework: PhotosUI.framework
        embed: false
      - framework: Photos.framework
        embed: false
      - framework: Speech.framework
        embed: false
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 学霸帝AI
        CFBundleName: XuebaAI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSCameraUsageDescription: "学霸帝AI需要使用相机来拍摄照片进行分析"
        NSPhotoLibraryUsageDescription: "学霸帝AI需要访问相册来选择图片进行分析"
        NSPhotoLibraryAddUsageDescription: "学霸帝AI需要保存图片到相册"
        NSSpeechRecognitionUsageDescription: "学霸帝AI需要语音识别来进行语音输入"
        NSMicrophoneUsageDescription: "学霸帝AI需要使用麦克风进行语音输入"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

schemes:
  XuebaAI:
    build:
      targets:
        XuebaAI: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
